# Metapackage installing the modules of the latest OpenSimulator release,
# built by apt-package with the version packaging/build gives (the last one
# of packaging/opensim-core.versions). Installing a module does not enable
# it, only the setup does.
name: opensim-modules
arch: all
platform: linux
version: ${OPENSIM_VERSION}
release: ${OPENSIM_REVISION}
version_schema: none
section: net
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  OpenSimulator modules (latest release)
  Installs the modules for OpenSimulator ${OPENSIM_VERSION}: search and the
  Gloebit currency. They are installed, not enabled.
homepage: https://github.com/GuduleLapointe/opensim-debian
license: AGPL-3.0-or-later

depends:
  - opensim-${OPENSIM_VERSION}-opensimsearch
  - opensim-${OPENSIM_VERSION}-gloebit
