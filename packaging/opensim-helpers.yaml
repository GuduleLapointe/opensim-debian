# The helpers of a grid (economy, search, offline messages), the opensim-helpers library of this
# project with its dependencies, as a webroot. Built by apt-package from build/opensim-helpers
# (packaging/build: composer create-project at the version the kit requires). Served by the web
# server of the machine: nothing is enabled by installing it (opensim web snippet).
name: opensim-helpers
arch: all
platform: linux
version: ${HELPERS_VERSION}
release: ${HELPERS_REVISION}
version_schema: none
section: web
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  Web helpers of an OpenSimulator grid (economy, search, offline messages)
  PHP scripts the viewers and the simulators query, installed in
  /usr/share/opensim-helpers, to be served by a web server. Their settings
  come from the OpenSim kit (the helpers.ini of each grid): see
  /usr/share/doc/opensim-helpers/README.Debian and `opensim web`.
homepage: https://github.com/GuduleLapointe/opensim-helpers
license: AGPL-3.0-or-later

depends:
  - php-curl
  - php-intl
  - php-mbstring
  - php-mysql
  - php-xml
recommends:
  - opensim-tools
suggests:
  - caddy | nginx | apache2
  - php-fpm | libapache2-mod-php
  - php-imagick

contents:
  - src: build/opensim-helpers
    dst: /usr/share/opensim-helpers
    type: tree
  # Not a file to edit: the settings are read from the OpenSim kit
  - src: packaging/opensim-helpers.config.php
    dst: /usr/share/opensim-helpers/includes/config.php
    file_info:
      mode: 0644
  - src: packaging/opensim-helpers.README.Debian
    dst: /usr/share/doc/opensim-helpers/README.Debian
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/opensim-helpers.postinst
