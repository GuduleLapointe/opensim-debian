# OpenSim tools, built by apt-package from build/opensim-tools, prepared by
# packaging/build. ${VERSION} comes from the git tag.
# The tools in /usr/share/opensim-tools, the opensim command, the service
# account and the system layout: config in /etc/opensim, data in
# /var/lib/opensim, logs in /var/log/opensim, cache in /var/cache/opensim,
# created on install. The OpenSimulator releases come in their own packages
# (opensim-<version>), each one registered as an install profile.
name: opensim-tools
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: net
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  OpenSimulator installation and management tools
  Installs and runs OpenSimulator grids and regions with the files at the
  standard places: config in /etc/opensim, data in /var/lib/opensim, logs
  and cache in /var. The opensim command starts, stops and monitors the
  instances; opensim setup creates grids. Works with the packaged
  OpenSimulator releases or any other one.
homepage: https://github.com/GuduleLapointe/opensim-debian
license: AGPL-3.0-or-later

depends:
  - adduser
  - bsdextrautils | bsdmainutils
  - crudini
  - curl
  - php-cli (>= 2:8.1)
  - php-mbstring
  - procps
  - screen
  - sudo
recommends:
  - default-mysql-client | mariadb-client
  - uuid-runtime
suggests:
  - opensim

contents:
  - src: build/opensim-tools
    dst: /usr/share/opensim-tools
    type: tree
  - src: /usr/share/opensim-tools/bin/opensim
    dst: /usr/bin/opensim
    type: symlink
  - src: packaging/opensim.service
    dst: /usr/lib/systemd/system/opensim.service
    file_info:
      mode: 0644
  - src: share/bash_completion.d/opensim
    dst: /usr/share/bash-completion/completions/opensim
    file_info:
      mode: 0644
  - src: packaging/opensim-tools.copyright
    dst: /usr/share/doc/opensim-tools/copyright
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/opensim-tools.postinst
  preremove: packaging/opensim-tools.prerm
  postremove: packaging/opensim-tools.postrm

deb:
  # The OpenSimulator releases installed or removed, to update their profiles
  triggers:
    interest_noawait:
      - /usr/share/opensim
