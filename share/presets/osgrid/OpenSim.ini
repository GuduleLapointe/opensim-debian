;; Preset of the grid osgrid.org, for the simulators that join it: what OSGrid publishes in the OpenSim.ini of its regions.
;;
;; A preset has the structure of the folder of a grid (<etc>/grids/<grid>), with only the files that have settings of the grid.
;; The simulators that join the grid include this OpenSim.ini (and config-include/GridCommon.ini when there is one) from here,
;; after their own config, so what the preset says wins: a preset is read, not copied into any grid, and not changed. A
;; variant of a grid is another preset, in <etc>/presets.
;;
;; Only what the grid says for its simulators is here, as an ordinary OpenSimulator .ini. What is the simulator's own (ports,
;; folders, database, estate, console) is not.
;; The region itself is not here either: OSGrid gives its UUID and its position when the region is registered on its web site
;; (add it as an existing region).

[SimulatorFeatures]
    MapTileURL = "http://maptiles.osgrid.org:80"

[Messaging]
    OfflineMessageModule = "Offline Message Module V2"
    OfflineMessageURL = "http://services.osgrid.org"
    MuteListModule = MuteListModule
    MuteListURL = "http://services.osgrid.org"
    ForwardOfflineGroupMessages = false

[UserProfiles]
    ProfileServiceURL = "http://services.osgrid.org"

[Groups]
    Enabled = true
    Module = GroupsModule
    ServicesConnectorModule = XmlRpcGroupsServicesConnector
    GroupsServerURI = "http://groups.osgrid.org/xmlrpc.php"
    NoticesEnabled = true
    MessagingModule = GroupsMessagingModule
    MessagingEnabled = true
    MessageOnlineUsersOnly = true

[Search]
    Module = OpenSimSearch
    SearchURL = "http://search.osgrid.org/query.php"

[DataSnapshot]
    index_sims = true
    data_exposure = minimum
    gridname = "OSGrid"
    data_services = "http://search.osgrid.org/register.php"

[Economy]
    AllowFreeTestUpload = true
    MeshModelAllowTextureToInventory = true
    economy = "http://helper.osgrid.org/"

[XBakes]
    URL = "http://xbakes.osgrid.org"

;; The custom display names of OSGrid are served by a module that OSGrid publishes (DisplayNameSimModule), which is not part
;; of OpenSimulator. With it installed, uncomment this, and add DisplayNameCapsModule to SharedRegionModules in the [Modules]
;; of config-include/GridCommon.ini
