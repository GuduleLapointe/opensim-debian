;; Preset of the grid speculoos.world, for the simulators that join it.
;;
;; A preset has the structure of the folder of a grid (<etc>/grids/<grid>), with only the files that have settings of the grid.
;; The simulators that join the grid include this OpenSim.ini (and config-include/GridCommon.ini when there is one) from here,
;; after their own config, so what the preset says wins: a preset is read, not copied into any grid, and not changed. A
;; variant of a grid is another preset, in <etc>/presets.
;;
;; Only what the grid says for its simulators is here, as an ordinary OpenSimulator .ini. What is the simulator's own (ports,
;; folders, database, estate, console, voice, mail) is not.

[Hypergrid]
    HomeURI = "http://speculoos.world:8002"
    GatekeeperURI = "http://speculoos.world:8002"

;; The private services of the grid: its simulators only (the server of the simulator must be allowed by the grid)
[GridService]
    GridServerURI = "http://speculoos.world:8003"

[Messaging]
    Gatekeeper = "http://speculoos.world:8002"
    OfflineMessageModule = OfflineMessageModule
    OfflineMessageURL = "https://speculoos.world/helpers/offline.php"

[UserProfiles]
    ProfileServiceURL = "http://speculoos.world:8002"

[Groups]
    Enabled = true
    Module = "Groups Module V2"
    ServicesConnectorModule = "Groups HG Service Connector"
    LocalService = remote
    GroupsServerURI = "http://speculoos.world:8003"
    MessagingModule = "Groups Messaging Module V2"
    NoticesEnabled = true
    MessageOnlineUsersOnly = true

;; In-world search: the grid is searched with the 2do directory, which knows the grid by its gatekeeper
[Search]
    Module = OpenSimSearch
    SearchURL = "https://2do.directory/helpers/query.php?gk=http://speculoos.world:8002"

[DataSnapshot]
    index_sims = true
    data_exposure = minimum
    gridname = "Speculoos"
    DATA_SRV_Speculoos = "https://speculoos.world/helpers/register.php"
    DATA_SRV_2do = "https://2do.directory/helpers/register.php"

[Economy]
    UserServer = "http://speculoos.world:8002"
    economy = "https://speculoos.world/helpers/"
    SellEnabled = true
    PriceUpload = 0
    PriceGroupCreate = 0
    economymodule = Gloebit
