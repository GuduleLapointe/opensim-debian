# A setup in a file: opensim import setup.yaml --apply (JSON works too); without --apply, the command
# tells what it would make. --grid, --simulator and --users restrict it to a part of the file.
# The setup of a grid is kept in its folder (setup.json, for its owner only), which makes the same grid again.
#
# Only the name of the grid and the user and password of its database are required.
# Everything else has the default of the setup.

grid:
  name: My Grid
  # hostname: play.example.org
  # web_url: https://play.example.org
  # hypergrid: true
  # helpers: true            # economy and search served by opensim-helpers
  # helpers_path: /helpers   # after the web URL
  database:
    user: opensim
    password: change-me
    # admin_user: root       # to make the database and its user when they do not exist
    # admin_password: ...

# The first account, owner of the first estate. The email is optional.
owner:
  name: Jane Doe
  password: change-me-too
  # email: jane@example.org

simulators:
  - regions:
      - name: Welcome
        roles: [default, default_hg]   # DefaultRegion, DefaultHGRegion, FallbackRegion
      # - { name: Beach, location: "1001,1000", port: 9003 }

# The accounts to make, in the format of the bulk import (opensim import accounts.csv --users makes
# a list like this one alone). A password left out is made, and written in the result file.
users:
  - { first: Bob, last: Roe, password: pw-for-bob }
  - { first: Cy, last: Doe, email: cy@example.org }
